@font-face{font-family:'MyFont';src:url('./Myfont-Regular.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#18121b;--card:#251b29;--ink:#fff0f6;--mute:#d4a5ba;--line:#3d2944;--pink:#ff9ec4;--pinkbg:#3b1e30;--mint:#f7b2cd;--mintbg:#331a29;--btn:#ff9ec4;--btntxt:#1b0f18;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff5f9;--card:#ffffff;--ink:#361c2c;--mute:#8f5e76;--line:#f5d0e0;--pink:#ff85b3;--pinkbg:#ffe4ef;--mint:#ff9ec4;--mintbg:#fff0f6;--btn:#ff7aa8;--btntxt:#ffffff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'MyFont',Nunito,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px}
.logo{width:60px;height:60px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font:600 24px 'MyFont',Fredoka,sans-serif;margin:0}
.clock{margin:18px 0 6px;font:600 56px/1 'MyFont',Fredoka,sans-serif;letter-spacing:-1px}
.date{color:var(--mute);margin-bottom:18px}
.next{background:var(--pinkbg);border-radius:18px;padding:12px 16px;margin-bottom:18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=time],input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
input[type=text]{flex:1 1 160px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
button{font:600 15px 'MyFont',Nunito,sans-serif;border:0;border-radius:12px;padding:10px 16px;background:var(--btn);color:var(--btntxt);cursor:pointer}
button.ghost{background:var(--bg);color:var(--ink)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.t{font:600 20px 'MyFont',Fredoka,sans-serif;min-width:92px}
.t small{display:block;font:12px Nunito;color:var(--mute)}
.body{flex:1;min-width:0}
.body b{overflow-wrap:anywhere}
.body p{margin:0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.stamp{display:inline-block;margin-top:4px;font-size:12px;background:var(--mintbg);color:var(--ink);border-radius:8px;padding:1px 8px;font-family:ui-monospace,Menlo,monospace}
.done .body b{text-decoration:line-through;opacity:.55}
.icon{background:none;color:var(--mute);padding:6px 8px}
.empty{color:var(--mute);text-align:center;padding:12px}
details summary{cursor:pointer;font-weight:700}
details .row{margin-top:12px}
#ring{position:fixed;inset:0;background:rgba(24,14,22,.92);display:none;place-items:center;padding:24px;z-index:9}
