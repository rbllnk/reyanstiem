<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reyan’s Tiem">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16152b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<title>Reyan’s Tiem Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'MyFont';src:url('./MyFont.ttf.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
@font-face{font-family:'MyFont';src:url('./MyFontNumbers.ttf') format('truetype');unicode-range:U+30-39;font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#18121b;--card:#251b29;--ink:#fff0f6;--mute:#d4a5ba;--line:#3d2944;--pink:#ff9ec4;--pinkbg:#3b1e30;--mint:#f7b2cd;--mintbg:#331a29;--btn:#ff9ec4;--btntxt:#1b0f18;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff5f9;--card:#ffffff;--ink:#361c2c;--mute:#8f5e76;--line:#f5d0e0;--pink:#ff85b3;--pinkbg:#ffe4ef;--mint:#ff9ec4;--mintbg:#fff0f6;--btn:#ff7aa8;--btntxt:#ffffff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'MyFont',Nunito,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px}
.logo{width:60px;height:60px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font:600 24px 'MyFont',Fredoka,sans-serif;margin:0}
.clock{margin:18px 0 6px;font:600 56px/1 'MyFont',Fredoka,sans-serif;letter-spacing:-1px}
.date{color:var(--mute);margin-bottom:18px}
.next{background:var(--pinkbg);border-radius:18px;padding:12px 16px;margin-bottom:18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=tiem],input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
input[type=text]{flex:1 1 160px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
button{font:600 15px 'MyFont',Nunito,sans-serif;border:0;border-radius:12px;padding:10px 16px;background:var(--btn);color:var(--btntxt);cursor:pointer}
button.ghost{background:var(--bg);color:var(--ink)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.t{font:600 20px 'MyFont',Fredoka,sans-serif;min-width:92px}
.t small{display:block;font:12px Nunito;color:var(--mute)}
.body{flex:1;min-width:0}
.body b{overflow-wrap:anywhere}
.body p{margin:0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.stamp{display:inline-block;margin-top:4px;font-size:12px;background:var(--mintbg);color:var(--ink);border-radius:8px;padding:1px 8px;font-family:ui-monospace,Menlo,monospace}
.done .body b{text-decoration:line-through;opacity:.55}
.icon{background:none;color:var(--mute);padding:6px 8px}
.empty{color:var(--mute);text-align:center;padding:12px}
details summary{cursor:pointer;font-weight:700}
details .row{margin-top:12px}
#ring{position:fixed;inset:0;background:rgba(24,14,22,.92);display:none;place-items:center;padding:24px;z-index:9}
#ring.on{display:grid}
#ring .box{background:var(--card);border-radius:28px;padding:28px;text-align:center;max-width:380px;width:100%}
#ring .logo{margin:0 auto 12px;width:140px;height:140px;background:none;font-size:48px;animation:wob 1s infinite}
#ring h2{font:600 28px 'MyFont',Fredoka,sans-serif;margin:0 0 6px;overflow-wrap:anywhere}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){#ring .logo{animation:none}}
.gentle{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:16px}
.gentle h3{margin:0 0 4px;font:600 16px 'MyFont',Fredoka,sans-serif;color:var(--pink)}
.gentle p{margin:0;color:var(--mute);font-size:14px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--pinkbg);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;flex:1 1 140px}
.pill small{display:block;color:var(--mute);font-size:12px}
.top-actions{display:flex;gap:8px;align-items:center}
.cal-btn{background:var(--pinkbg);color:var(--pink);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font:600 13px 'MyFont',Nunito,sans-serif;cursor:pointer;white-space:nowrap}
.pager{overflow:hidden;width:100%}
.pager-track{display:flex;width:200%;transform:translateX(0%);transition:transform .36s cubic-bezier(.22,1,.36,1);will-change:transform}
.pager-track.show-cal{transform:translateX(-50%)}
.page{width:50%;flex:0 0 50%;padding-right:2px}
@media (prefers-reduced-motion:reduce){.pager-track{transition:none}}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-title{font:600 20px 'MyFont',Fredoka,sans-serif;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-dow{font-size:12px;color:var(--mute);padding:4px 0}
.cal-day{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font:600 14px 'MyFont',Nunito,sans-serif;transition:transform .16s ease,border-color .16s ease,background .16s ease}
.cal-day:active{transform:scale(.95)}
.cal-day.muted{opacity:.35}
.cal-day.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.cal-day.selected{background:var(--pinkbg);border-color:var(--pink)}
.dots{display:flex;gap:3px;margin-top:3px;min-height:6px;align-items:center;justify-content:center}
.dot{width:6px;height:6px;border-radius:999px;display:inline-block}
.dot-monthsary{background:#ff9ec4}
.dot-birthday{background:#ffd166}
.dot-holiday{background:#7bdff2}
.dot-other{background:#c8b6ff}
.mark-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pinkbg);color:var(--ink);margin-right:6px}
select.mark-type{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 10px}
.cal-card-art{position:relative;overflow:hidden}
.cal-card-art.has-cal-bg{background-image:var(--cal-bg);background-size:cover;background-position:center;background-repeat:no-repeat}
.cal-card-art.has-cal-bg::before{content:"";position:absolute;inset:0;background:rgba(24,18,27,.62);pointer-events:none;z-index:0}
.cal-card-art > *{position:relative;z-index:1}
.cal-card-art.has-cal-bg .cal-day{background:rgba(24,18,27,.45)}
.cal-card-art.has-cal-bg .cal-day.selected{background:rgba(255,158,196,.28)}
.bottom-install{margin-top:16px}
</style>
</head>
<body>
<main>
<header><div class="logo" id="logo">⏰</div><h1 id="appName" style="flex:1">Reyan’s Tiem Manager</h1><div class="top-actions"><button class="cal-btn" id="viewSwitchBtn" aria-label="Switch to Calendar">Calendar</button></div></header>
<div class="pager" id="pager">
<div class="pager-track" id="pagerTrack">
<section class="page" id="tiemPage" aria-label="Tiem Manager">
<div class="clock" id="clock">--:--</div>
<div class="date" id="date"></div>
<div class="next" id="next"></div>

<div class="card">
<div class="row">
<input type="time" id="fTime" aria-label="Tiem" value="09:00">
<input type="text" id="fText" placeholder="What to do (e.g. drink water)" maxlength="80">
</div>
<div class="row" style="margin-top:8px">
<input type="text" id="fNote" placeholder="Cute note (optional)" maxlength="120">
</div>
<div class="row" style="margin-top:10px">
<label class="chk"><input type="checkbox" id="fAlarm" checked> Alarm</label>
<label class="chk"><input type="checkbox" id="fRepeat" checked> Repeat daily</label>
<button id="add" style="margin-left:auto">Add to schedule</button>
</div>
</div>

<div class="card" id="list"></div>

<details class="card">
<summary>Alarm settings</summary>



<div class="row"><label>Snooze minutes <input type="number" id="sSnooze" min="1" max="60" style="width:80px"></label></div>
<div class="row"><label>Heads-up before alarm (minutes, 0 = off) <input type="number" id="sLead" min="0" max="60" style="width:80px"></label></div>
<div class="row">
<button class="ghost" id="perm">Turn on alarms + notifications</button>
<button class="ghost" id="test">Test alarm</button>

</div>
<p class="date" style="margin-top:12px">Alarms and morning/bedtime/meal nudges work while this page is open in a tab, on your Home Screen, or via notifications when allowed. Keep the sound on.</p>
</details>
<div class="bottom-install" id="bottomInstallWrap">
<button class="ghost" id="bottomInstallBtn" style="width:100%">Install App</button>
</div>
</section>

<section class="page" id="calPage" aria-label="Calendar">
<div class="card cal-card-art" id="calCard" style="margin-top:16px">
<div class="cal-head">
<button class="ghost" id="prevMonth" aria-label="Previous month">‹</button>
<h2 class="cal-title" id="calMonthLabel">Month</h2>
<button class="ghost" id="nextMonth" aria-label="Next month">›</button>
</div>
<div class="cal-grid" id="calGrid"></div>
<p class="date" style="margin:10px 0 0;font-size:12px">Swipe right to go back to tiem manager · Tap a date to add marks</p>
</div>

<div class="card">
<h3 id="selectedDateTitle" style="margin:0 0 10px;font:600 18px 'MyFont',Fredoka,sans-serif">Selected Date</h3>
<div class="row">
<select class="mark-type" id="markCategory" aria-label="Mark type">
<option value="monthsary">Monthsary</option>
<option value="birthday">Birthday</option>
<option value="holiday">Holiday</option>
<option value="other">Special Tiem</option>
</select>
<input type="text" id="markLabel" placeholder="Label (e.g. 14th monthsary, Reyan’s bday)" maxlength="80">
<button id="saveMarkBtn">Mark</button>
</div>
<div id="selectedDateMarks" style="margin-top:12px"></div>
</div>
</section>
</div>
</div>
</main>

<div id="ring" role="alertdialog" aria-live="assertive"><div class="box">
<div class="logo" id="ringLogo">⏰</div>
<h2 id="ringText"></h2><p id="ringNote" class="date"></p>
<div class="row" style="justify-content:center"><button id="snooze" class="ghost">Snooze</button><button id="ringDone">Done</button></div>
</div></div>

<script>
var KEY='tinytime.v1';
var TZ='Asia/Manila';
/* OWNER-ONLY DESIGN: name, logo and alarm sound are set here by the owner. Users cannot change them. */
var BRAND={name:'Reyan’s Tiem Manager',logo:'./logo.png',clock:'./clock.png',calBg:'./cal-bg.png',sound:''};
var S={tasks:[],name:'Reyan’s Tiem Manager',logo:'',sound:'',snooze:5,lead:5};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(S.name==='Tiny Tiem')S.name='Reyan’s Tiem Manager';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save. Try a smaller logo or sound file.')}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function dayKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d)}
function hm(d){return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}
function fmt(hm){var p=hm.split(':'),d=new Date();d.setHours(+p[0],+p[1],0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function isDone(t){if(!t.doneAt)return false;return t.repeat?dayKey(new Date(t.doneAt))===dayKey(new Date()):true}

function applyBrand(){
$('appName').textContent=BRAND.name;document.title=BRAND.name;
var h=BRAND.logo?'<img alt="" src="'+BRAND.logo+'">':'⏰';
var c=BRAND.clock?'<img alt="" src="'+BRAND.clock+'">':h;
$('logo').innerHTML=h;$('ringLogo').innerHTML=c;
}

function render(){
var ts=S.tasks.slice().sort(function(a,b){return a.tiem<b.tiem?-1:1});
if(!ts.length){$('list').innerHTML='<div class="empty">Nothing scheduled yet. Add your first tiem above.</div>'}
else $('list').innerHTML=ts.map(function(t){
var d=isDone(t);
return '<div class="task'+(d?' done':'')+'"><div class="t">'+fmt(t.tiem)+'<small>'+(t.alarm?'alarm on':'no alarm')+(t.repeat?' · daily':'')+'</small></div>'
+'<div class="body"><b>'+esc(t.text)+'</b>'+(t.note?'<p>'+esc(t.note)+'</p>':'')
+(d?'<span class="stamp">done '+new Date(t.doneAt).toLocaleString([],{timeZone:TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span>':'')+'</div>'
+'<button class="ghost" data-a="done" data-id="'+t.id+'">'+(d?'Undo':'Done')+'</button>'
+'<button class="icon" data-a="del" data-id="'+t.id+'" aria-label="Delete">✕</button></div>'}).join('');
tickNext();
}

function tickNext(){
var now=new Date(),cur=hm(now);
var up=S.tasks.filter(function(t){return !isDone(t)&&t.tiem>=cur}).sort(function(a,b){return a.tiem<b.tiem?-1:1})[0];
$('next').innerHTML=up?'Up next at <b>'+fmt(up.tiem)+'</b>: '+esc(up.text):'Nothing left for today. Rest up.';
}

$('list').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
var t=S.tasks.find(function(x){return x.id===b.dataset.id});
if(b.dataset.a==='del')S.tasks=S.tasks.filter(function(x){return x.id!==b.dataset.id});
else if(t)t.doneAt=isDone(t)?null:new Date().toISOString();
save();render();
});

$('add').onclick=function(){
var text=$('fText').value.trim();if(!text||!$('fTime').value){$('fText').focus();return}
S.tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),tiem:$('fTime').value,text:text,note:$('fNote').value.trim(),alarm:$('fAlarm').checked,repeat:$('fRepeat').checked,fired:'',snoozeUntil:0,doneAt:null});
$('fText').value='';$('fNote').value='';save();render();
};

/* ---- alarm ---- */
var ac,beepTimer,audio,queue=[],ringing=null;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){if(!ac)return;[0,.25,.5].forEach(function(o){var s=ac.createOscillator(),g=ac.createGain();s.type='sine';s.frequency.value=880;g.gain.setValueAtTime(.0001,ac.currentTime+o);g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+o+.18);s.connect(g);g.connect(ac.destination);s.start(ac.currentTime+o);s.stop(ac.currentTime+o+.2)})}
function startSound(){stopSound();
if(BRAND.sound){audio=new Audio(BRAND.sound);audio.loop=true;audio.play().catch(function(){});}
else{beep();beepTimer=setInterval(beep,1500)}
if(navigator.vibrate)navigator.vibrate([300,150,300]);}
function stopSound(){clearInterval(beepTimer);if(audio){audio.pause();audio=null}}

function ring(t){
queue.push(t);if(!ringing)next();
}
function next(){
ringing=queue.shift();
if(!ringing){$('ring').classList.remove('on');return}
$('ringText').textContent=ringing.text;$('ringNote').textContent=ringing.note||'It’s '+fmt(ringing.tiem)+'.';
$('ring').classList.add('on');startSound();
try{if('Notification' in window&&Notification.permission==='granted')new Notification(ringing.text,{body:ringing.note||fmt(ringing.tiem)})}catch(e){}
}
$('ringDone').onclick=function(){stopSound();if(ringing.id!=='test'){ringing.doneAt=new Date().toISOString();ringing.snoozeUntil=0;save();render()}ringing=null;next()};
$('snooze').onclick=function(){stopSound();if(ringing.id!=='test'){ringing.snoozeUntil=Date.now()+S.snooze*60000;save()}ringing=null;next()};

function heads(t){
$('next').innerHTML='Heads up: <b>'+esc(t.text)+'</b> starts in '+S.lead+' min';
try{if('Notification' in window&&Notification.permission==='granted')new Notification(t.text,{body:'Starts in '+S.lead+' minutes, at '+fmt(t.tiem)})}catch(e){}
if(navigator.vibrate)navigator.vibrate(200);
}
function check(){
var now=new Date(),cur=hm(now),key=dayKey(now)+' '+cur;
$('clock').textContent=now.toLocaleTimeString([],{timeZone:TZ,hour:'numeric',minute:'2-digit'});
$('date').textContent=now.toLocaleDateString([],{timeZone:TZ,weekday:'long',month:'long',day:'numeric'})+', Philippine tiem';
S.tasks.forEach(function(t){
if(!t.alarm||isDone(t)||ringing===t||queue.indexOf(t)>-1)return;
if(t.snoozeUntil&&Date.now()>=t.snoozeUntil){t.snoozeUntil=0;save();ring(t);return}
if(t.tiem===cur&&t.fired!==key&&!t.snoozeUntil){t.fired=key;save();ring(t)}
});
if(S.lead>0)S.tasks.forEach(function(t){var pk=dayKey(now)+' '+t.tiem;
if(t.alarm&&!isDone(t)&&t.pre!==pk&&hm(new Date(now.getTime()+S.lead*60000))===t.tiem){t.pre=pk;save();heads(t)}});
if(now.getSeconds()===0)tickNext();
}
setInterval(check,1000);

/* ---- settings ---- */
$('sSnooze').value=S.snooze;$('sLead').value=S.lead;

$('sSnooze').onchange=function(){S.snooze=Math.max(1,Math.min(60,+$('sSnooze').value||5));save()};
$('sLead').onchange=function(){var v=parseInt($('sLead').value,10);S.lead=isNaN(v)?5:Math.max(0,Math.min(60,v));save()};

$('perm').onclick=function(){unlock();beep();try{if('Notification' in window)Notification.requestPermission()}catch(e){}};
$('test').onclick=function(){unlock();ring({id:'test',text:'Test alarm',note:'This is what your reminder will look like.',tiem:'00:00'})};
document.addEventListener('click',unlock,{once:true});


var SURPRISE_ALL_DONE=[
  'you finished every single tiem on today’s list—so proud of you! taek a deep breath, rest, nd doomscroll na bozz',
  'all scheduled tiems complete! u showed up for urself today, nd that deserves ril rest. mwa',
  'everything on ur list is checked off! relax without guilt. :)'
];
var SURPRISE_EMPTY=[
  'ur schedule is quiet right now... whenever you’re ready, add a gentle tiem or a smol cozy goal.',
  'nothing on the board yet! gou drink watur, stretch, or plan 1 little thing u want to do.',
  'blank canvas for your tiem today... add a reminder wehnever sumthing comes up so yew dont havb to hold it in ur head'
];
var SURPRISE_MORNING=[
  'gud morningg! taek it slow, drink sum watur, nd be kind to yourself todie.. i love youu',
  'guddmoringg! youve got dis.',
  'gudd morningg! start w waht feels manageable first nd protect ur peace thry da day.'
];
var SURPRISE_MEAL=[
  'gud tiem to eat—dont skip meals nd eatwhaell',
  'food check! grab sumthing warm nd take ur tiem eating.'
];
var SURPRISE_NIGHT=[
  'sleep reminder: screens down soon bozz... let ur body rest for tomorrow’s tiem.',
  'slep tiem check... doomscroll, stretch a little, nd get sum rest so u wake up lighter.'
];
var SURPRISE_PROGRESS=[
  'youre doing better than u think todie... am so proud of u',
  'even smol progress counts on a busy tiem.',
  'yew dont hab to rush vrything at once... jus focus on da next tiem ahead.'
];
var DAILY_SURPRISE_LINE='wag k n magpa generaet kai chatgpt ng shed mu';

S.calMarks = S.calMarks || {};
S.lastAutoSurprise = S.lastAutoSurprise || '';

function tiemSeed(d){
  var k = dayKey(d);
  var s = 0;
  for (var i=0; i<k.length; i++) s += k.charCodeAt(i);
  return s;
}

function getSurpriseByTiem(now){
  var parts = hm(now).split(':');
  var mins = (+parts[0])*60 + (+parts[1]);
  var seed = tiemSeed(now);
  var total = S.tasks.length;
  var doneCount = S.tasks.filter(function(t){return isDone(t)}).length;
  var msg = '';

  if (mins >= 300 && mins < 660) {
    msg = SURPRISE_MORNING[seed % SURPRISE_MORNING.length];
  } else if ((mins >= 720 && mins < 810) || (mins >= 1110 && mins < 1200)) {
    msg = SURPRISE_MEAL[(seed + mins) % SURPRISE_MEAL.length];
  } else if (mins >= 1290 || mins < 270) {
    msg = SURPRISE_NIGHT[seed % SURPRISE_NIGHT.length];
  } else if (total === 0) {
    msg = SURPRISE_EMPTY[seed % SURPRISE_EMPTY.length];
  } else if (doneCount === total) {
    msg = SURPRISE_ALL_DONE[seed % SURPRISE_ALL_DONE.length];
  } else {
    msg = SURPRISE_PROGRESS[(seed + doneCount) % SURPRISE_PROGRESS.length];
  }

  if (((seed * 5 + mins) % 7) === 0) {
    msg = msg + ' · ' + DAILY_SURPRISE_LINE;
  }
  return msg;
}

var origTickNext = tickNext;
tickNext = function(){
  var now = new Date();
  var cur = hm(now);
  var up = S.tasks.filter(function(t){return !isDone(t)&&t.tiem>=cur}).sort(function(a,b){return a.tiem<b.tiem?-1:1})[0];
  if (up) {
    $('next').innerHTML = 'Up next at <b>' + fmt(up.tiem) + '</b>: ' + esc(up.text);
  } else {
    $('next').innerHTML = esc(getSurpriseByTiem(now));
  }
};

var origCheck = check;
check = function(){
  origCheck();
  var now = new Date();
  var dk = dayKey(now);
  var slotKey = dk + '-' + hm(now);
  if (now.getSeconds() === 0 && S.lastAutoSurprise !== slotKey) {
    S.lastAutoSurprise = slotKey;
    save();
    tickNext();
  }
};

/* ---- Separate Calendar View + Smooth Swipe ---- */
var isCalOpen = false;
var viewDate = new Date();
var selectedIso = dayKey(new Date());

function setCalView(openCal){
  isCalOpen = !!openCal;
  var track = $('pagerTrack');
  var btn = $('viewSwitchBtn');
  if (track) track.classList.toggle('show-cal', isCalOpen);
  if (btn) btn.textContent = isCalOpen ? 'Tiem' : 'Calendar';
}

if ($('viewSwitchBtn')) {
  $('viewSwitchBtn').onclick = function(){ setCalView(!isCalOpen); };
}

var touchStartX = 0, touchStartY = 0, swiping = false;
var pagerEl = $('pager');
if (pagerEl) {
  pagerEl.addEventListener('touchstart', function(e){
    if (!e.touches || !e.touches.length) return;
    if (e.target && e.target.closest('.cal-grid')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    swiping = true;
  }, {passive:true});

  pagerEl.addEventListener('touchend', function(e){
    if (!swiping || !e.changedTouches || !e.changedTouches.length) return;
    swiping = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0 && !isCalOpen) setCalView(true);
      else if (dx > 0 && isCalOpen) setCalView(false);
    }
  }, {passive:true});
}

function isoFromYMD(y, m, d){
  return y + '-' + pad(m + 1) + '-' + pad(d);
}

function renderCalendar(){
  var grid = $('calGrid');
  var label = $('calMonthLabel');
  if (!grid || !label) return;

  var y = viewDate.getFullYear();
  var m = viewDate.getMonth();
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  label.textContent = monthNames[m] + ' ' + y;

  var dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var htmlOut = dows.map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');

  var firstDow = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var todayIso = dayKey(new Date());

  for (var i = firstDow - 1; i >= 0; i--) {
    var pd = prevDays - i;
    var py = m === 0 ? y - 1 : y;
    var pm = m === 0 ? 11 : m - 1;
    var pIso = isoFromYMD(py, pm, pd);
    htmlOut += '<button type="button" class="cal-day muted" data-iso="' + pIso + '">' + pd + '</button>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var iso = isoFromYMD(y, m, d);
    var marks = S.calMarks[iso] || [];
    var cls = 'cal-day';
    if (iso === todayIso) cls += ' today';
    if (iso === selectedIso) cls += ' selected';
    var dotsHtml = marks.slice(0, 4).map(function(mk){
      var t = mk.type || 'other';
      return '<span class="dot dot-' + t + '"></span>';
    }).join('');
    htmlOut += '<button type="button" class="cal-day' + cls.slice(7) + '" data-iso="' + iso + '">' + d + '<span class="dots">' + dotsHtml + '</span></button>';
  }

  var totalCells = firstDow + daysInMonth;
  var trailing = (7 - (totalCells % 7)) % 7;
  for (var tDay = 1; tDay <= trailing; tDay++) {
    var ny = m === 11 ? y + 1 : y;
    var nm = m === 11 ? 0 : m + 1;
    var nIso = isoFromYMD(ny, nm, tDay);
    htmlOut += '<button type="button" class="cal-day muted" data-iso="' + nIso + '">' + tDay + '</button>';
  }

  grid.innerHTML = htmlOut;
  renderSelectedMarks();
}

function renderSelectedMarks(){
  var titleEl = $('selectedDateTitle');
  var listEl = $('selectedDateMarks');
  if (!titleEl || !listEl) return;
  titleEl.textContent = 'Marks for ' + selectedIso;
  var marks = S.calMarks[selectedIso] || [];
  if (!marks.length) {
    listEl.innerHTML = '<div class="empty" style="padding:6px">No marks on this date yet. Add a monthsary, birthday, or holiday above.</div>';
    return;
  }
  listEl.innerHTML = marks.map(function(mk, idx){
    var typeLabel = mk.type === 'monthsary' ? 'Monthsary' : mk.type === 'birthday' ? 'Birthday' : mk.type === 'holiday' ? 'Holiday' : 'Special Tiem';
    return '<div class="task" style="padding:8px 0"><div class="body"><span class="mark-badge">' + esc(typeLabel) + '</span><b>' + esc(autoCorrectCalText(mk.label || typeLabel)) + '</b></div><button class="icon" data-del-mark="' + idx + '" aria-label="Remove mark">✕</button></div>';
  }).join('');
}

if ($('prevMonth')) {
  $('prevMonth').onclick = function(){ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); renderCalendar(); };
}
if ($('nextMonth')) {
  $('nextMonth').onclick = function(){ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); renderCalendar(); };
}
if ($('calGrid')) {
  $('calGrid').addEventListener('click', function(e){
    var btn = e.target.closest('.cal-day');
    if (!btn || !btn.dataset.iso) return;
    selectedIso = btn.dataset.iso;
    var parts = selectedIso.split('-');
    viewDate = new Date(+parts[0], (+parts[1]) - 1, 1);
    renderCalendar();
  });
}
function autoCorrectCalText(str){
  if (!str) return '';
  return str
    .replace(/\bmonthsary\b/gi, 'monthsari')
    .replace(/\banniversary\b/gi, 'anniversarii')
    .replace(/\bchrismas\b/gi, 'xmas')
    .replace(/\bchristmas\b/gi, 'xmas')
    .replace(/\bnew year\b/gi, 'new yr');
}

/* Optional: if you upload a calendar background PNG (e.g. ./cal-bg.png) to GitHub, set BRAND.calBg to './cal-bg.png' */
if (typeof BRAND !== 'undefined' && BRAND.calBg) {
  var calCardEl = $('calCard');
  if (calCardEl) {
    calCardEl.style.setProperty('--cal-bg', "url('" + BRAND.calBg + "')");
    calCardEl.classList.add('has-cal-bg');
  }
}

if ($('saveMarkBtn')) {
  $('saveMarkBtn').onclick = function(){
    var cat = $('markCategory') ? $('markCategory').value : 'other';
    var rawLbl = $('markLabel') ? $('markLabel').value.trim() : '';
    var lbl = autoCorrectCalText(rawLbl || cat);
    if (!S.calMarks[selectedIso]) S.calMarks[selectedIso] = [];
    S.calMarks[selectedIso].push({ type: cat, label: lbl || cat });
    if ($('markLabel')) $('markLabel').value = '';
    save();
    renderCalendar();
  };
}
if ($('selectedDateMarks')) {
  $('selectedDateMarks').addEventListener('click', function(e){
    var delBtn = e.target.closest('[data-del-mark]');
    if (!delBtn) return;
    var i = +delBtn.dataset.delMark;
    if (S.calMarks[selectedIso]) {
      S.calMarks[selectedIso].splice(i, 1);
      if (!S.calMarks[selectedIso].length) delete S.calMarks[selectedIso];
      save();
      renderCalendar();
    }
  });
}

applyBrand();render();renderCalendar();check();

/* ---- PWA install & offline service worker ---- */
var deferredPrompt=null;
function isStandaloneApp(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function syncBottomInstall(){
  var wrap=$('bottomInstallWrap');
  if(wrap)wrap.style.display=isStandaloneApp()?'none':'block';
}
syncBottomInstall();
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  syncBottomInstall();
});
function triggerInstall(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt=null;
      syncBottomInstall();
    });
  } else {
    alert('To install: on Android/Windows tap your browser menu (⋮ or ...) and choose "Install app" or "Add to Home Screen"; on iPhone Safari tap Share then "Add to Home Screen".');
  }
}
if($('bottomInstallBtn')){
  $('bottomInstallBtn').onclick=triggerInstall;
}
window.addEventListener('appinstalled',function(){
  deferredPrompt=null;
  syncBottomInstall();
});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
